name: medellin-analysis312
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas=3.0.6
  - folium=0.20.0
  - openpyxl=3.1.5
  - python-dotenv=1.2.4
  # Análisis geográfico: geopandas en los notebooks; shapely y pyproj en la ubicación por niveles
  - geopandas=1.1.3
  - shapely=2.1.2
  - pyproj=3.7.2
  - jupyterlab=4.5.6
  - pip
  # Desarrollo
  - pytest>=8
  - pdoc=16.0.0
  - pip:
      # opencage no se publica en conda-forge
      - opencage==3.3.0
