# Configuración de georef.
#
# Este archivo se lee al arrancar y se valida antes de tocar ningún dato: si hay
# una errata (una clave desconocida, una lista vacía, un valor repetido...), el
# programa termina y muestra todos los errores juntos.
# Para usar otro archivo: python -m georef --config <ruta> <subcomando>

# Municipios del área metropolitana: sus registros se estandarizan y geocodifican.
# Los demás solo se exportan a estandarizado/fuera_area_metropolitana.xlsx.
# Escríbelos EXACTAMENTE como aparecen en la columna de ciudad del archivo de
# entrada (mayúsculas, sin tildes, con " - ANTIOQUIA"): un municipio mal escrito
# no da error, simplemente no coincide con ningún registro.
[area_metropolitana]
municipios = [
    "MEDELLIN - ANTIOQUIA",
    "ITAGUI - ANTIOQUIA",
    "BELLO - ANTIOQUIA",
    "GIRARDOTA - ANTIOQUIA",
    "BARBOSA - ANTIOQUIA",
    "COPACABANA - ANTIOQUIA",
    "ENVIGADO - ANTIOQUIA",
    "SABANETA - ANTIOQUIA",
    "CALDAS - ANTIOQUIA",
    "LA ESTRELLA - ANTIOQUIA",
]

# Subconjuntos del área metropolitana. Se extraen de las coordenadas ya
# obtenidas, sin consultar la API:
#   python -m georef subconjunto --area medellin
# El nombre (lo que va después de "subconjuntos.") solo puede tener minúsculas
# sin tildes, dígitos y guiones bajos, porque se usa en los nombres de archivo.
# Sus municipios deben estar en la lista del área metropolitana.
[subconjuntos.medellin]
municipios = ["MEDELLIN - ANTIOQUIA"]

# Columnas del archivo de entrada que usa el programa.
[columnas]
ciudad = "Ciudad Residencia"
direccion = "Direccion de residencia"

# Vocabulario de la estandarización de direcciones.
[direcciones]
# Tipos de vía con los que debe empezar una dirección para geocodificarse.
# Las demás (VEREDA, FINCA...) van a estandarizado/especiales_area_metropolitana.xlsx.
tipos_via = ["CL", "CR", "AV", "CIR", "DG", "TV"]
# Palabras que, además de los tipos de vía, forman parte de la dirección y no
# del complemento.
palabras_clave = ["BIS", "KM"]
# Abreviaturas de la vía y la numeración. Se aplican solo a palabras completas
# ("NORTE" -> "N", pero "NORTE" dentro de otra palabra no cambia) y solo a la parte
# de la vía y la numeración: nunca al complemento, al barrio ni a la zona. El orden
# de la lista no importa.
equivalencias = [
    ["CALLE", "CL"],
    ["CARRERA", "CR"],
    ["CRR", "CR"],
    ["CRA", "CR"],
    ["CRRA", "CR"],  # añadida en normalizacion-direcciones (aparece en los datos)
    ["CLL", "CL"],
    ["NÚMERO", "#"],
    ["NUMERO", "#"],
    ["NO", "#"],
    ["DIAGONAL", "DG"],
    ["CIRCULAR", "CIR"],
    ["TRANSVERSAL", "TV"],
    ["AVENIDA", "AV"],
    ["NO.", "#"],
    ["NORTE", "N"],
    ["SUR", "S"],
    ["ESTE", "E"],
    ["ORIENTE", "E"],
    ["OESTE", "O"],
    ["OCCIDENTE", "O"],
]

# Datos de referencia geográfica (rutas relativas a la raíz del proyecto).
# La estandarización reconoce el barrio y la comuna solo en los registros del
# municipio con polígonos; los demás municipios no tienen polígonos de barrio.
[referencia]
geojson = "data/limite_barrio_vereda_cata.geojson"
alias_barrios = "data/alias_barrios.csv"
alias_comunas = "data/alias_comunas.csv"
municipio_con_poligonos = "MEDELLIN - ANTIOQUIA"

# Ubicación por niveles (python -m georef ubicar). Cada registro del área
# metropolitana recibe el punto más preciso disponible: DIRECCION (punto de
# OpenCage validado), BARRIO, COMUNA o MUNICIPIO. Solo se consultan a OpenCage
# las vías principales del municipio con polígonos.
[ubicacion]
# Texto de las consultas: "abreviado" (CL 10 #20-30, MEDELLIN, ANTIOQUIA, Colombia)
# o "expandido" (Calle 10 # 20-30, ...). Para elegir, compara los dos con:
#   python -m georef comparar-consultas --muestra 50
formato_consulta = "abreviado"
# Un punto de OpenCage solo se acepta si su "confidence" (0 a 10) llega a este
# valor. Valor provisional: recalíbralo con comparar-consultas.
confianza_minima = 8
# Tipos de resultado de OpenCage que nunca se aceptan: indican que solo se
# encontró la ciudad o algo mayor.
tipos_rechazados = ["city", "county", "state", "country"]
# Distancia máxima, en metros, del punto de OpenCage a Medellín y al barrio (o,
# si no hay barrio, a la comuna) que declaró el estudiante. Más lejos, prevalece
# el lugar declarado.
tolerancia_metros = 250
# Segundos mínimos entre el inicio de dos peticiones (el free trial admite una
# por segundo).
pausa_segundos = 1
# Máximo de peticiones por ejecución (el free trial admite 2.500 al día). Las
# consultas que no se hagan quedan pendientes para la siguiente ejecución.
limite_consultas = 1000
# Segunda consulta con el lugar con nombre del complemento (por ejemplo
# "UNIDAD LOS PINOS, LAURELES, MEDELLIN, ANTIOQUIA, Colombia") cuando la primera
# no se acepta. Gasta más cuota; desactivada hasta medir si aporta algo.
consulta_lugar_complemento = false
# Palabras del complemento con las que empieza un lugar con nombre.
palabras_lugar = ["UNIDAD", "EDIFICIO", "URBANIZACION", "URB", "CONJUNTO", "CONDOMINIO", "PARQUE"]
# Nombre completo de cada tipo de vía, para el formato "expandido".
nombres_via = { CL = "Calle", CR = "Carrera", AV = "Avenida", CIR = "Circular", DG = "Diagonal", TV = "Transversal" }

# Puntos del nivel MUNICIPIO de la ubicación. Generados con 'python -m georef consultar-municipios'
# el 2026-10-12 (fuente: OpenCage; consulta "<MUNICIPIO>, <DEPARTAMENTO>, Colombia").
# Revísalos y corrígelos a mano si alguno no es el municipio correcto.
[puntos_municipios]
"MEDELLIN - ANTIOQUIA" = { latitud = 6.2697324, longitud = -75.6025597, fuente = "OpenCage", fecha = "2026-10-12" }
