# Configuración de georef.
#
# Este archivo se lee al arrancar y se valida antes de tocar ningún dato: si hay
# una errata (una clave desconocida, una lista vacía, un valor repetido...), el
# programa termina y muestra todos los errores juntos.
# Para usar otro archivo: python -m georef --config <ruta> <subcomando>

# Municipios del área metropolitana: sus registros se estandarizan y geocodifican.
# Los demás solo se exportan a estandarizado/fuera_area_metropolitana.xlsx.
# Escríbelos EXACTAMENTE como aparecen en la columna de ciudad del archivo de
# entrada (mayúsculas, sin tildes, con " - ANTIOQUIA"): un municipio mal escrito
# no da error, simplemente no coincide con ningún registro.
[area_metropolitana]
municipios = [
    "MEDELLIN - ANTIOQUIA",
    "ITAGUI - ANTIOQUIA",
    "BELLO - ANTIOQUIA",
    "GIRARDOTA - ANTIOQUIA",
    "BARBOSA - ANTIOQUIA",
    "COPACABANA - ANTIOQUIA",
    "ENVIGADO - ANTIOQUIA",
    "SABANETA - ANTIOQUIA",
    "CALDAS - ANTIOQUIA",
    "LA ESTRELLA - ANTIOQUIA",
]

# Subconjuntos del área metropolitana. Se extraen de las coordenadas ya
# obtenidas, sin consultar la API:
#   python -m georef subconjunto --area medellin
# El nombre (lo que va después de "subconjuntos.") solo puede tener minúsculas
# sin tildes, dígitos y guiones bajos, porque se usa en los nombres de archivo.
# Sus municipios deben estar en la lista del área metropolitana.
[subconjuntos.medellin]
municipios = ["MEDELLIN - ANTIOQUIA"]

# Columnas del archivo de entrada que usa el programa.
[columnas]
ciudad = "Ciudad Residencia"
direccion = "Direccion de residencia"

# Vocabulario de la estandarización de direcciones.
[direcciones]
# Tipos de vía con los que debe empezar una dirección para geocodificarse.
# Las demás (VEREDA, FINCA...) van a estandarizado/especiales_area_metropolitana.xlsx.
tipos_via = ["CL", "CR", "AV", "CIR", "DG", "TV"]
# Palabras que, además de los tipos de vía, forman parte de la dirección y no
# del complemento.
palabras_clave = ["BIS", "KM"]
# Abreviaturas de la vía y la numeración. Se aplican solo a palabras completas
# ("NORTE" -> "N", pero "NORTE" dentro de otra palabra no cambia) y solo a la parte
# de la vía y la numeración: nunca al complemento, al barrio ni a la zona. El orden
# de la lista no importa.
equivalencias = [
    ["CALLE", "CL"],
    ["CARRERA", "CR"],
    ["CRR", "CR"],
    ["CRA", "CR"],
    ["CRRA", "CR"],  # añadida en normalizacion-direcciones (aparece en los datos)
    ["CLL", "CL"],
    ["NÚMERO", "#"],
    ["NUMERO", "#"],
    ["NO", "#"],
    ["DIAGONAL", "DG"],
    ["CIRCULAR", "CIR"],
    ["TRANSVERSAL", "TV"],
    ["AVENIDA", "AV"],
    ["NO.", "#"],
    ["NORTE", "N"],
    ["SUR", "S"],
    ["ESTE", "E"],
    ["ORIENTE", "E"],
    ["OESTE", "O"],
    ["OCCIDENTE", "O"],
]

# Datos de referencia geográfica (rutas relativas a la raíz del proyecto).
# La estandarización reconoce el barrio y la comuna solo en los registros del
# municipio con polígonos; los demás municipios no tienen polígonos de barrio.
[referencia]
geojson = "data/limite_barrio_vereda_cata.geojson"
alias_barrios = "data/alias_barrios.csv"
alias_comunas = "data/alias_comunas.csv"
municipio_con_poligonos = "MEDELLIN - ANTIOQUIA"
